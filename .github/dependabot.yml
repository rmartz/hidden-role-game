version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # NOTE: cooldown is deliberately not used anywhere in this file, and should
    # not be re-added. It adds friction without achieving its goal:
    #  - Dependabot's own `cooldown` is leaky — it holds the initial update but
    #    then immediately raises a follow-up for the newer version, so the delay
    #    is not actually enforced.
    #  - Enforcing our own cooldown via `minimumReleaseAge` fails for npm:
    #    Dependabot keeps its PRs current, so even a pinned-back release still
    #    pulls transitive deps that are too new — the very freshness the cooldown
    #    was meant to avoid — and pnpm hard-fails lockfile resolution
    #    (ERR_PNPM_NO_MATURE_MATCHING_VERSION) whenever any transitive dep in the
    #    fast-moving Storybook/Vite toolchain is inside the window (tried in #740).
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Trivial minor/patch bumps batch by dev/prod (the two catch-all groups at
    # the bottom). Most MAJOR bumps match no group and raise individual PRs —
    # the ones most likely to need code changes, so they warrant isolated
    # review. The exceptions, listed FIRST to win group-assignment precedence:
    # the lockstep families (so a member never bumps without the rest, an
    # inherently broken update) and the prettier and typescript major+minor
    # bumps (each isolated into its own PR — a formatter or compiler bump is
    # higher-impact than a routine dependency and warrants visibility).
    #
    # This set is evidence-based, not assumed: scripts/dependabot-audit.mjs
    # measures the per-group human-intervention rate over all Dependabot PR
    # history (see docs/dependabot-audit.md, issue #885). The prettier (#785)
    # and typescript (#872) isolations are each validated by a real breakage the
    # group contained; react/lodash/vite have merged cleanly where exercised.
    # The former storybook, eslint, and tailwind major-only family groups were
    # REMOVED because they never produced a single PR — their lockstep benefit
    # was 100% assumed. Ungrouped, a future major of one of them surfaces as
    # individual per-package PRs the audit can measure; if one actually breaks
    # when split apart, that is the evidence to re-add its group.
    groups:
      # Lockstep families. The scope of each depends on whether it crosses the
      # dev/prod boundary:
      #  - A family split across dev AND prod (react, lodash) groups across ALL
      #    update types, because on a minor/patch bump the dev/prod catch-alls
      #    below would otherwise scatter its prod members from their dev @types.
      #  - vite is all-dev and interlocked (the @vitejs/plugin-react <-> vite <->
      #    vitest coupling), so it groups for MAJOR only: minor/patch already ride
      #    the single dev-dependencies group, and major is the only update type
      #    the catch-alls exclude and the only one where a split family breaks.
      react:
        # react + react-dom (prod) ship the same version; @types/react(-dom)
        # (dev) track react's major. Cross-realm -> grouped across all types.
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        # vite + its react plugin + vitest + @vitest/* are one interlocked
        # toolchain (the @vitejs/plugin-react 6 <-> vite 8 coupling) — all dev,
        # so major-only; minor/patch ride dev-dependencies.
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
      lodash:
        # lodash (prod) + @types/lodash (dev): the types major tracks lodash's.
        # Cross-realm -> grouped across all types, so the runtime and its types
        # are not split across the dev/prod catch-alls.
        patterns:
          - "lodash"
          - "@types/lodash"
      # Prettier is special-cased ahead of dev-dependencies. Dependabot assigns
      # each update to the FIRST group it matches, so listing prettier first
      # routes its major AND minor bumps into a dedicated PR — a Prettier minor
      # bump routinely reformats files (the trip-split #114 case), so it needs
      # isolated review even though it is "just" a minor. Prettier *patch* bumps
      # match no update-type here and fall through to dev-dependencies below,
      # staying batched with the other trivial dev updates. (Ordering is
      # semantically required here, so this group is intentionally not in
      # alphabetical order with the two below.)
      prettier:
        patterns:
          - "prettier"
        update-types:
          - "major"
          - "minor"
      typescript:
        # TypeScript is the language itself, not just another dependency — a
        # compiler major/minor can surface new type errors across the codebase,
        # so isolate it into its own PR for visibility (like prettier above). A
        # typescript *patch* matches no update-type here and falls through to
        # dev-dependencies, staying batched. The exact "typescript" pattern
        # leaves typescript-eslint untouched (it stays in the eslint family).
        patterns:
          - "typescript"
        update-types:
          - "major"
          - "minor"
      dev-dependencies:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
      include: "scope"
