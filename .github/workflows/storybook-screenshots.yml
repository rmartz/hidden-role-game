name: Storybook Screenshots

# Advisory per-PR screenshot gallery, delegated to the shared rmartz/storybook-ci
# reusable workflow (issue #906). It builds Storybook, screenshots the stories a
# PR's changes touch, and posts them as one update-in-place PR comment whose
# images are GitHub user-attachments uploaded by `gh --attach` — replacing the
# per-PR orphan image branch (`gh-screenshots-pr-<N>`) this repo pushed before
# (#861). With no branch to write, the caller needs no `contents: write`, and
# storybook-screenshots-cleanup.yml is deleted rather than ported.
#
# The advisory isolation (`continue-on-error`), per-PR concurrency, fork-skip,
# capture deadline, and change gating all live in the shared workflow, so no
# `concurrency` or `continue-on-error` block belongs here.
#
# `secrets: inherit` forwards STORYBOOK_SCREENSHOT_PAT, required because the
# user-attachments upload endpoint rejects the Actions GITHUB_TOKEN. As of
# storybook-ci v1.1.0 a preflight step runs before the expensive Storybook build:
# when the PAT is missing or invalid it posts one non-blocking advisory PR comment
# and skips the build and capture, so a misconfigured PAT announces itself instead
# of looking like success. The whole job is skipped on fork PRs so the PAT never
# reaches fork-authored code.
#
# This is advisory and never a required check, so unlike storybook-tests.yml it
# may safely use an `on.paths` filter to stay off unrelated PRs. The filter is
# `src/**` rather than only `*.stories.*` because the shared default resolver is
# `colocation`: a component edited without touching its story still regenerates
# the co-located story's screenshot, which is the false negative this repo's
# bespoke changed-stories-only capture had.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - ".storybook/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  screenshots:
    uses: rmartz/storybook-ci/.github/workflows/storybook-screenshots.yml@8ff19856f03b239964f9a01b091dcf9616511f47 # v1.2.0
    secrets: inherit
