name: bot-automerge

# rmartz/bot-automerge-action classifies a trusted bot PR (Dependabot
# patch/minor bumps; release-please release PRs where used) and enables
# GitHub-native auto-merge on it. It posts no check-run — it only makes the PR
# *eligible* to auto-merge; the repo's required status checks (merge-safety +
# the CI gates, required on the default branch) are what it then waits on, so an
# untrusted change never rides straight to main.
#
# `pull_request_target` (not `pull_request`): Dependabot PRs run with a
# read-only token, and enabling auto-merge needs base-context write. This is
# expected for this action, not a review flag. A composite action can't declare
# its own triggers or use `secrets: inherit`, so the caller owns the trigger,
# the write scopes, and the checkout.
#
# Auto-merge is enabled with an installation token for the rmartz-merge-bot
# GitHub App, not the job token: a merge enabled with GITHUB_TOKEN fires no push
# workflows, so a bot merge would reach main with no CI or deploy run.
# App-authored events do trigger them, and the App has its own rate-limit pool,
# separate from the user's (rmartz/scripts#22).
#
# The pin is kept current by Dependabot's github-actions ecosystem.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write # enable GitHub-native auto-merge on the PR
  pull-requests: write # read PR metadata + turn on auto-merge

jobs:
  bot-automerge:
    # Skip the job outright on PRs the CLI could never trust, so a human PR shows a
    # free `skipped` instead of checking out and installing the CLI just to no-op.
    # The two conditions mirror the CLI's own detectBotPrType exactly —
    # Dependabot by author, release-please by head branch prefix — so nothing
    # eligible is skipped. The `autorelease: pending` label is not a signal: since
    # v2.0.0 the CLI ignores it, because anyone with triage permission can apply it
    # (rmartz/bot-automerge#41).
    # It is deliberately not an author test: a release PR is authored by
    # whichever identity release-please runs under (a bot App or a real user),
    # so its author is not predictable and an author-only guard could skip
    # release PRs. The head branch prefix is the stable signal.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      || startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The App's Client ID and private key are stored as both Actions and
      # Dependabot secrets (a Dependabot-triggered run sees only the latter).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.MERGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_BOT_PRIVATE_KEY }}
      - uses: rmartz/bot-automerge-action@4ab67b0f5254bf47e615731cb79e7cd4a949edcb # v2.2.3
        with:
          pr: ${{ github.event.pull_request.number }}
          # Installation token for the rmartz-merge-bot GitHub App, never
          # GITHUB_TOKEN. An auto-merge enabled with GITHUB_TOKEN fires no push
          # workflows, so a bot merge would reach main with no push-triggered CI,
          # release, or merge-safety run (rmartz/bot-automerge-action#31).
          # App-authored events do trigger them, and the App has its own
          # rate-limit pool, separate from the user's (rmartz/scripts#22). The
          # token step fails closed if the App secrets are missing.
          token: ${{ steps.app-token.outputs.token }}
