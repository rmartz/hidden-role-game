name: bot-automerge

# rmartz/bot-automerge-action classifies a trusted bot PR (Dependabot
# patch/minor bumps; release-please release PRs where used) and enables
# GitHub-native auto-merge on it. It posts no check-run — it only makes the PR
# *eligible* to auto-merge; the repo's required status checks (merge-safety +
# the CI gates, required on the default branch) are what it then waits on, so an
# untrusted change never rides straight to main.
#
# `pull_request_target` (not `pull_request`): Dependabot PRs run with a
# read-only token, and enabling auto-merge needs base-context write. This is
# expected for this action, not a review flag. A composite action can't declare
# its own triggers or use `secrets: inherit`, so the caller owns the trigger,
# the write scopes, and the checkout.
#
# Auto-merge is enabled with the BOT_AUTOMERGE_TOKEN real-actor PAT, not the
# job token: a merge enabled with GITHUB_TOKEN fires no push workflows, so a
# bot merge would reach main with no CI or deploy run.
#
# The pin is kept current by Dependabot's github-actions ecosystem.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write # enable GitHub-native auto-merge on the PR
  pull-requests: write # read PR metadata + turn on auto-merge

jobs:
  bot-automerge:
    # Skip the job outright on PRs the CLI could never trust, so a human PR shows a
    # free `skipped` instead of checking out and installing the CLI just to no-op.
    # The two conditions mirror the CLI's own detectBotPrType exactly —
    # Dependabot by author, release-please by head branch prefix — so nothing
    # eligible is skipped. The `autorelease: pending` label is not a signal: since
    # v2.0.0 the CLI ignores it, because anyone with triage permission can apply it
    # (rmartz/bot-automerge#41).
    # It is deliberately not an author test: release-please run under a PAT
    # authors its release PR as that real user, not a [bot] account, so an
    # author-only guard would skip release PRs.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      || startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rmartz/bot-automerge-action@a67b7de61ed8b20964ed4b8e4f2fd0aa43d00113 # v2.1.5
        with:
          pr: ${{ github.event.pull_request.number }}
          # Real-actor PAT, stored as both an Actions and a Dependabot secret (a
          # Dependabot-triggered run sees only the latter). An auto-merge enabled
          # with GITHUB_TOKEN fires no push workflows, so a bot merge would reach
          # main with no push-triggered CI, release, or merge-safety run
          # (rmartz/bot-automerge-action#31). When the secret is unset the action
          # falls back to GITHUB_TOKEN itself.
          token: ${{ secrets.BOT_AUTOMERGE_TOKEN }}
