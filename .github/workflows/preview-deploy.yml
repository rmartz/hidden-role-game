name: Preview Deploy

# Vercel preview deploy via the shared rmartz/vercel-preview-ci reusable
# workflow (#764). A PR gets a preview when its title has a functional type
# (`feat`, `fix`, `perf`, `revert`) or it carries the `preview` label;
# `no preview` always skips. It is redeployed on each new push and the URL is
# posted as a sticky PR comment. The gate, fork safety, and per-PR concurrency
# live in the shared workflow:
# https://github.com/rmartz/vercel-preview-ci/blob/main/docs/consuming.md
#
# This is the sole preview path: vercel.json's `git.deploymentEnabled` disables
# Vercel's Git-integration deploys for every branch except `main`.
#
# Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  preview:
    # `[WIP]`-titled PRs are held as unfinished work and get no preview. The
    # shared gate deploys drafts and reads only the title's type, so the `[WIP]`
    # hold is kept here.
    if: ${{ !contains(github.event.pull_request.title, '[WIP]') }}
    uses: rmartz/vercel-preview-ci/.github/workflows/vercel-preview.yml@52dca86876bf76f85b11a8fe0365879ab7e0f110 # v3.0.0
    secrets: inherit
