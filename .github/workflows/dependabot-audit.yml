name: Dependabot audit

on:
  schedule:
    # 09:00 UTC on the 1st of each month.
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  audit:
    name: Grouping-outcome audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_TITLE: "Dependabot grouping audit"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x

      - name: Run audit
        run: node scripts/dependabot-audit.mjs --out report.md

      - name: Publish to job summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert tracking issue
        run: |
          number=$(gh issue list --state all --search "$ISSUE_TITLE in:title" \
            --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
            gh issue reopen "$number" 2>/dev/null || true
          else
            gh issue create --title "$ISSUE_TITLE" --body-file report.md --label dependencies --label DevOps
          fi
