name: pr-lifecycle
# Shows which event and action started each run (e.g. pull_request_target /
# review_requested), so the run list says what re-reconciled a PR.
run-name: pr-lifecycle (${{ github.event_name }}${{ github.event.action && format('/{0}', github.event.action) || '' }})

# Runs the @rmartz/pr-lifecycle reconciler through the published, SHA-pinned
# rmartz/pr-lifecycle-action: on every relevant event it recomputes each PR's
# lifecycle state and converges its labels (approved, changes requested,
# blocked, escalation needed, fix required, ci failing, review requested).
#
# It also arms GitHub-native auto-merge when a PR reaches `approved`, including
# an eligible Dependabot PR (rmartz/pr-lifecycle#75; this replaced
# bot-automerge.yml), and with `auto-update` brings an approved PR that
# merge-safety labels `update required` current with update-branch. A Dependabot
# PR is never updated: a person or Dependabot itself rebases it. See
# https://github.com/rmartz/pr-lifecycle-action/blob/main/docs/consuming.md.
#
# SAFETY: auto-merge lands the moment the default-branch ruleset's required
# checks pass (CI, merge-safety, pr-policy including its UAT gate, repo
# hygiene). This is only safe while those checks are REQUIRED on main.
#
# Every read and write goes through an installation token for the
# rmartz-pr-lifecycle GitHub App, not GITHUB_TOKEN, so labels are attributed to the
# bot and API calls draw on the App's own rate-limit pool rather than the
# user's (rmartz/scripts#22). Unlike GITHUB_TOKEN, App-authored events trigger
# workflows, so the job skips the label and review-request events the App
# itself causes; see the job's `if`.

on:
  # pull_request_target: Dependabot PRs get a read-only token under pull_request,
  # and labels need write. The action reads the PR over the API and never checks
  # out or runs PR code.
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - synchronize
      - edited
      - labeled
      - unlabeled
      # A bot review request added (or removed by hand) after a run's settle
      # wait moves the PR into (or out of) awaiting-bot-review.
      - review_requested
      - review_request_removed
  pull_request_review:
    types: [submitted, dismissed, edited]
  # CI completion re-routes a PR through the CI gate. check_suite never fires for
  # suites GitHub Actions creates, so workflow_run lists every Actions workflow
  # behind a required check. That includes pr-policy: the CI gate ignores a hold
  # check's pending but counts its failure, so its failing-to-passing transition
  # needs a re-reconcile to clear `ci failing`. merge-safety needs no entry: the
  # CI gate ignores it and its `update required` label fires `labeled`.
  check_suite:
    types: [completed]
  workflow_run:
    workflows: [CI, Storybook Tests, Repo Hygiene, pr-policy]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to reconcile
        required: true

# GITHUB_TOKEN is unused: the App token below carries every permission the
# action needs.
permissions: {}

jobs:
  reconcile:
    # A review on a fork PR runs with a read-only token and no secrets, so it
    # cannot write labels; skip it. The fork PR is reconciled on its next
    # pull_request_target event, or on demand via workflow_dispatch.
    #
    # Also skip the label and review-request events this workflow's own writes
    # cause. Every run recomputes the PR from its current facts, so the run that
    # wrote them already converged, and a follow-up run would only no-op while
    # cancelling the in-flight writer. Only the App's own login is excluded: a
    # label from a person or another workflow still re-reconciles.
    if: >-
      (github.event_name != 'pull_request_review' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      !(github.event_name == 'pull_request_target' &&
      github.event.sender.login == 'rmartz-pr-lifecycle[bot]' &&
      contains(fromJSON('["labeled", "unlabeled", "review_requested", "review_request_removed"]'),
      github.event.action))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One run per PR at a time; a newer event supersedes an in-flight run, since
    # every run recomputes the PR from its current facts. CI-completion events are
    # keyed by head SHA, as the PR number is only known inside the action.
    concurrency:
      group: >-
        pr-lifecycle-${{ github.event.pull_request.number || inputs.pr ||
        github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}
      cancel-in-progress: true
    steps:
      # An installation token for the rmartz-pr-lifecycle App, which
      # pr-lifecycle acts as. Its Client ID and private key are stored as both
      # Actions and Dependabot secrets (a Dependabot-triggered run sees only the
      # latter). The step fails closed if they are missing or the App lacks a
      # permission.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.PR_LIFECYCLE_CLIENT_ID }}
          private-key: ${{ secrets.PR_LIFECYCLE_PRIVATE_KEY }}
          permission-contents: write # branch rules, base head, carry-over commits; merging and updating a branch
          permission-pull-requests: write # labels, review requests, arming
          permission-issues: write # labels and the advisory comment
          permission-statuses: write # the pr-lifecycle/sign-off status
          permission-workflows: write # updating a branch whose diff touches a workflow file
          permission-checks: read # the CI gate
      - uses: rmartz/pr-lifecycle-action@cb58fb834f4761dcf691d6801b8ba2e23316a04a # v4.3.0
        with:
          # A Next.js app with something to user-test: a PR that could be
          # user-facing stays `UAT pending` until a person signs it off.
          uat: "on"
          # The App token is also the real actor (`token`) that arms, merges, and
          # updates branches: a merge armed with GITHUB_TOKEN fires no `on: push`
          # workflows, and a branch update pushed with it runs no CI. Without
          # `token`, arming and updating are skipped, never done with GITHUB_TOKEN.
          github-token: ${{ steps.app-token.outputs.token }}
          token: ${{ steps.app-token.outputs.token }}
          arm-auto-merge: true
          auto-update: true
