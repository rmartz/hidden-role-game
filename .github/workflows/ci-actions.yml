name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  # Decide whether the heavy jobs (tests / storybook-* / build / typecheck) need
  # to run. They are skipped only when a PR changes *nothing but* provably-inert
  # documentation — a DENYLIST, not a code allowlist: anything not matched here
  # (including .mdx, package.json, lockfiles, configs, workflows, assets) fails
  # SAFE and runs the full suite. Non-PR events (push to main) always run
  # everything. Format + Lint are never gated (Prettier validates .md).
  detect-changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull_request event — running the full suite."
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Changed files:"
          echo "$changed"
          code_changed=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.mdx) code_changed=true; break;;
              *.md | docs/* | LICENSE | *.txt) ;;
              *)
                code_changed=true
                break
                ;;
            esac
          done <<< "$changed"
          echo "Resolved code_changed=$code_changed"
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: detect-changes
    if: needs.detect-changes.outputs.code_changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Headless suites only (node / hooks / components) — no browser, so this
      # job stays fast and needs no Playwright install. The browser-based
      # storybook project runs in the separate storybook-tests.yml workflow,
      # which delegates to the shared rmartz/storybook-ci (issue #906).
      - run: pnpm exec vitest run --project node --project hooks --project components

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: detect-changes
    if: needs.detect-changes.outputs.code_changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm tsc

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: detect-changes
    if: needs.detect-changes.outputs.code_changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build

  sentry-release:
    name: Sentry Release
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'push'
    # Gates on every job in THIS workflow. The Storybook checks moved to
    # storybook-tests.yml (a reusable-workflow caller), and `needs` cannot
    # reach across workflow files — so a Storybook failure on main no longer
    # holds the release back. Acceptable: the commit is already on main by
    # then, and this job only associates commits with a Sentry release for
    # error attribution; it deploys nothing.
    needs: [tests, lint, format, typecheck, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: reedmartz
          SENTRY_PROJECT: hidden-role-game
        with:
          environment: production
          version: ${{ github.sha }}
          # Associate commits via an explicit range now that the repo is
          # connected to Sentry's GitHub integration. Manual mode is used over
          # `auto` deliberately: `auto` resolves the *previous release* and
          # needs its commit reachable — fragile with our squash-merge workflow
          # (a squashed preview commit as predecessor breaks it). Manual passes
          # an explicit range instead — github.event.before is main's tip before
          # this push (always a reachable main commit), so the range
          # (before, sha] is exactly the commits this push introduced, and
          # Sentry resolves them server-side through the GitHub integration.
          set_commits: manual
          repo: ${{ github.repository }}
          commit: ${{ github.sha }}
          previous_commit: ${{ github.event.before }}
