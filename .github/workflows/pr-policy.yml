name: pr-policy

# Runs the @rmartz/pr-policy read-only PR content checks via
# rmartz/pr-policy-action, which posts the `pr-policy` verdict (a check-run and a
# matching commit status) and owns the `CI approval needed` label. The checks are
# listed in rmartz/pr-policy's docs/checks/index.md.
#
# This repo is a Next.js app, so it keeps the UAT gate: a PR stays pending until
# it carries `no UAT needed` or a person's `UAT passed`. Don't set `skip-uat`.
#
# pull_request_target is safe here only because nothing checks out or runs the
# PR's code; the Action reads everything through the API. It is needed so fork
# and Dependabot PRs still get a write token for the check-run, status, and label.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  # Re-run when pr-lifecycle posts its `pr-lifecycle/sign-off` status, which can
  # land after this run for the push. A `status` workflow runs from the default
  # branch too, so a PR can't change what it does.
  status:
  # Re-run when the pr-lifecycle caller finishes: it writes the UAT label with
  # GITHUB_TOKEN, which starts no `labeled` run, so require-uat-label would
  # otherwise never see it. Like `status`, this runs from the default branch.
  workflow_run:
    workflows: [pr-lifecycle]
    types: [completed]

permissions:
  checks: write # post the pr-policy check-run
  pull-requests: write # write the labels pr-policy owns (CI approval needed)
  contents: read # read changed files at the merge base and head
  statuses: write # post the pr-policy commit status and one per policy check (pr-policy / <check>)

concurrency:
  # A status or workflow_run event has no PR number; group it by its commit.
  group: pr-policy-${{ github.event.pull_request.number || github.event.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  # Not named `pr-policy`: the Action posts its own check-run and status under that
  # exact name, and a same-named job would add a second, always-green entry.
  pr-policy:
    name: pr-policy (evaluate)
    # Every commit status fires `status`, including pr-policy's own; only
    # pr-lifecycle's sign-off status re-runs the gate.
    if: github.event_name != 'status' || github.event.context == 'pr-lifecycle/sign-off'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: rmartz/pr-policy-action@8a474a38cc91b596bd1800739a3c7ee1a6235910 # v1.9.1
        with:
          pr: ${{ github.event.pull_request.number }}
          # Hold a PR with no UAT label, so every merge has an explicit UAT
          # determination (pr-lifecycle keeps one on every open PR).
          require-uat-label: true
          # Retitle a Dependabot linter/formatter bump to ci(...), the type the
          # pr-policy title check requires for it, instead of blocking on a hand edit.
          retitle-dependabot-ci: true
