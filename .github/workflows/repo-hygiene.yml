name: Repo Hygiene

# @rmartz/repo-hygiene quality gates, run via its published reusable workflow.
# This one SHA-pinned caller replaces our previously-bespoke check workflows and
# scripts (action-pins, package-pins, docs/OKF, AGENTS.md/CLAUDE.md pairing) and
# adds a CI conflict-markers backstop. The `@<sha>` pin is kept current by
# Dependabot's github-actions ecosystem, so new checks and fixes propagate with
# no edit here. Per-check settings live in .repo-hygiene.yml (passed as `config`).
#
# `checks` is explicit (not the default-on set) because we need the opt-in
# `package-pins` and want a curated list; the tradeoff is that a future
# default-on check does not auto-join — add it here when we want it. `file-caps`
# is intentionally omitted: our eslint `max-lines` rule already enforces
# per-file line caps for source and tests.
#
# Local pre-commit conflict-marker checking stays wired via
# .github/scripts/check-conflict-markers.sh (claude/hooks + .husky), so no local
# @rmartz install is needed — this caller is the CI half.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hygiene:
    permissions:
      contents: read
      packages: read
    uses: rmartz/repo-hygiene/.github/workflows/hygiene.yml@a0607d987a9ab7b86d6ed489459ba4ee9832d6c6 # v3.0.0
    with:
      checks: conflict-markers action-pins package-pins docs-links md-pairing okf okf-index
      config: .repo-hygiene.yml
