# Repository hygiene gates, enforced by @rmartz/repo-hygiene via the composite
# action (.github/workflows/repo-hygiene.yml). The enabled set is named there;
# per-check settings live below.
#
# Strict by default: this config adopts the "default strict, override as
# needed" model ahead of the upstream default flips (rmartz/repo-hygiene#106–
# #111). Settings fall into two groups:
#
#   - INTERIM: pre-states an upcoming upstream default. Delete the line once the
#     pinned action ships that default — the behavior does not change.
#   - OVERRIDE: a deliberate, permanent departure from the package default,
#     with the reason alongside.
#
# Every check runs at error; there is no warn tier (`warn` is only ever a
# temporary migration ramp).
#
# Known coverage delta vs. the old check-docs.mjs: `okf` does not validate our
# custom `gameMode` frontmatter field on mode pages (it enforces
# type/title/description/resource). The `resource` path already encodes the
# mode, so this is an accepted minor reduction.
checks:
  docs-links:
    # INTERIM (#108): validate #anchor fragments, not just file targets.
    anchors: true
  md-pairing:
    # INTERIM (#106, #107): error severity and the bare `@AGENTS.md` wrapper.
    wrapper: "@AGENTS.md"
    severity: error
  okf:
    # OVERRIDE: this repo's own closed OKF type vocabulary (see docs/index.md),
    # which documents game modes rather than scripts/libraries.
    types: [Actions, DataFlow, Guide, Reference, Roles]
    # OVERRIDE: mode pages (Actions/DataFlow/Roles) carry a `resource`;
    # Guide/Reference pages document a concept, not a single file.
    resourceExemptTypes: [Guide, Reference]
    # INTERIM (#106).
    severity: error
  okf-index:
    # INTERIM (#106).
    severity: error
  file-caps:
    # INTERIM (#109): the strict, error-only shared caps. Ordered first-match-
    # wins. The code and test caps match our eslint `max-lines` error tiers.
    overrides:
      - glob: "**/pnpm-lock.yaml"
        lines: { error: 100000 }
      - glob: "**/{AGENTS,CLAUDE}.md"
        lines: { error: 300 }
      - glob: "**/*.{test,spec}.{ts,tsx,js,jsx,mts,cts,mjs,cjs}"
        lines: { error: 600 }
      - glob: "**/*.{ts,tsx,js,jsx,mts,cts,mjs,cjs}"
        lines: { error: 400 }
      - glob: "**/*.md"
        lines: { error: 400 }
      - glob: "**/*"
        lines: { error: 400 }
